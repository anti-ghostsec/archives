[package]
name = "archives-core"
description = "Archives' engine: opens .zip, .7z and .rar, lists them, extracts all or some, and makes .zip and .7z"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
libc = "0.2"
# All three decoders are pure Rust and built in: nothing to install or
# download. Zip: the methods zips are really made with, and both kinds of
# password.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd", "aes-crypto"] }
# 7z: LZMA/LZMA2, BCJ filters, PPMd, BZip2, Deflate and AES-256; writing
# too ("compress"): LZMA2, AES-256.
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "compress"] }
# RAR 1.3 to 7 (RAR5 included), written from the format's description under
# Apache-2.0; not RARLAB's unrar source. Reading only. Pinned exactly: a
# young crate.
rars = { version = "=0.12.1", default-features = false, features = ["encryption"] }

[dev-dependencies]
# Only the tests make RARs.
rars = { version = "=0.12.1", default-features = false, features = ["encryption", "write"] }
